name: Reusable Tests

on:
  workflow_call:
    inputs:
      node_version:
        description: Node.js version for the test job
        required: false
        default: '22'
        type: string
      test_command:
        description: Test command; empty disables it
        required: false
        default: pnpm test
        type: string
      check_command:
        description: Static validation command; empty disables it
        required: false
        default: ''
        type: string
      coverage_command:
        description: Coverage command; empty disables it
        required: false
        default: ''
        type: string
      coverage_report_dir:
        description: Directory containing the coverage report for upload
        required: false
        default: coverage
        type: string
      upload_artifacts:
        description: Whether to upload the coverage report as a GitHub Actions artifact
        required: false
        default: false
        type: boolean
      timeout_minutes:
        description: Job timeout
        required: false
        default: 30
        type: number
    secrets:
      ORG_READ_TOKEN:
        description: Fine-grained token with read access to private submodules
        required: false

jobs:
  test:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.base_ref == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository and private submodules
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0

      - name: Checkout private submodules
        env:
          SHARED_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
        run: |
          if [ -n "$SHARED_READ_TOKEN" ]; then
            git config --global url."https://x-access-token:${SHARED_READ_TOKEN}@github.com/".insteadOf "https://github.com/"
            git submodule update --init --recursive
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        if: ${{ inputs.check_command != '' }}
        run: ${{ inputs.check_command }}

      - name: Test
        if: ${{ inputs.test_command != '' }}
        run: ${{ inputs.test_command }}

      - name: Coverage
        if: ${{ inputs.coverage_command != '' }}
        run: ${{ inputs.coverage_command }}

      - name: Upload coverage report
        if: ${{ inputs.upload_artifacts && inputs.coverage_command != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ inputs.coverage_report_dir }}