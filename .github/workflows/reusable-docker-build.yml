name: Reusable Build & Release

on:
  workflow_call:
    inputs:
      context:
        description: Docker build context directory
        required: false
        default: '.'
        type: string
      dockerfile:
        description: Path to Dockerfile
        required: true
        type: string
      image_name:
        description: Target image name in GHCR, for example es-crm
        required: true
        type: string
      platforms:
        description: Target platforms
        required: false
        default: linux/arm64
        type: string
      cache_scope:
        description: GitHub Actions cache scope
        required: false
        default: default
        type: string
      working_directory:
        description: Directory for pnpm install/check/test (relative to repo root)
        required: false
        default: '.'
        type: string
      package_json_path:
        description: Path to package.json used for version verification
        required: false
        default: package.json
        type: string
      pnpm_version:
        description: pnpm version; empty falls back to the packageManager field
        required: false
        default: ''
        type: string
      allow_version_reset:
        description: Allow a version that does not increase (one-time baseline reset)
        required: false
        default: false
        type: boolean
      pre_install_command:
        description: Optional command run at repo root before pnpm install
        required: false
        default: ''
        type: string
      check_command:
        description: Static validation command; empty disables it
        required: false
        default: pnpm check
        type: string
      test_command:
        description: Test command; empty disables it
        required: false
        default: pnpm test
        type: string
    secrets:
      ORG_READ_TOKEN:
        description: Fine-grained token with read access to private submodules
        required: false

jobs:
  build:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository and private submodules
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0

      - name: Checkout private submodules
        env:
          SHARED_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
        run: |
          if [ -n "$SHARED_READ_TOKEN" ]; then
            git config --global url."https://x-access-token:${SHARED_READ_TOKEN}@github.com/".insteadOf "https://github.com/"
            git submodule update --init --recursive
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ inputs.pnpm_version }}
          package_json_file: ${{ inputs.package_json_path }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ inputs.working_directory }}/pnpm-lock.yaml

      - name: Pre-install
        if: ${{ inputs.pre_install_command != '' }}
        run: ${{ inputs.pre_install_command }}

      - name: Install dependencies
        working-directory: ${{ inputs.working_directory }}
        run: pnpm install --frozen-lockfile

      - name: Check
        if: ${{ inputs.check_command != '' }}
        working-directory: ${{ inputs.working_directory }}
        run: ${{ inputs.check_command }}

      - name: Test
        if: ${{ inputs.test_command != '' }}
        working-directory: ${{ inputs.working_directory }}
        run: ${{ inputs.test_command }}

      - name: Verify release version
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          VERSION_FILE: ${{ inputs.package_json_path }}
          ALLOW_VERSION_RESET: ${{ inputs.allow_version_reset }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');

          const version = JSON.parse(fs.readFileSync(process.env.VERSION_FILE, 'utf8')).version;
          const parse = (value) => {
            const match = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.exec(value ?? '');
            if (!match) throw new Error(`Invalid semantic version: ${value}`);
            return match.slice(1).map(Number);
          };
          const current = parse(version);

          let base = process.env.BEFORE_SHA;
          if (!base || /^0+$/.test(base)) base = 'HEAD^';
          let previousVersion;
          try {
            previousVersion = JSON.parse(execFileSync('git', ['show', `${base}:${process.env.VERSION_FILE}`], { encoding: 'utf8' })).version;
          } catch {
            previousVersion = '0.0.0';
          }
          const previous = parse(previousVersion);
          const allowReset = process.env.ALLOW_VERSION_RESET === 'true';
          const increased = current.some((part, index) =>
            part > previous[index] && current.slice(0, index).every((value, prior) => value === previous[prior])
          );
          if (!increased && !allowReset) {
            throw new Error(`package.json version must increase: ${previousVersion} -> ${version}`);
          }
          if (!increased && allowReset) {
            console.log(`version reset allowed: ${previousVersion} -> ${version}`);
          }

          const output = process.env.GITHUB_OUTPUT;
          fs.appendFileSync(output, `version=${version}\nmajor=${current[0]}\nminor=${current[0]}.${current[1]}\n`);
          NODE

      - name: Determine build metadata
        id: meta
        run: |
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push multi-architecture image
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          build-args: |
            VITE_BUILD_TIME=${{ steps.meta.outputs.build_time }}
            VITE_BUILD_SHA=${{ steps.meta.outputs.short_sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:${{ steps.version.outputs.minor }}
            ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:${{ steps.version.outputs.major }}
            ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:${{ steps.meta.outputs.short_sha }}
            ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:latest
          cache-from: type=gha,scope=${{ inputs.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ inputs.cache_scope }},ignore-error=true
