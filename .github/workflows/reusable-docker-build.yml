name: Reusable App Validation & Release

on:
  workflow_call:
    inputs:
      context:
        description: Docker build context directory
        required: false
        default: '.'
        type: string
      dockerfile:
        description: Path to Dockerfile
        required: true
        type: string
      image_name:
        description: Target image name in GHCR, for example es-crm
        required: true
        type: string
      platforms:
        description: Target platforms
        required: false
        default: linux/amd64,linux/arm64
        type: string
      cache_scope:
        description: GitHub Actions cache scope
        required: false
        default: default
        type: string
      check_command:
        description: Static validation command; empty disables it
        required: false
        default: pnpm check
        type: string
      test_command:
        description: Test command; empty disables it
        required: false
        default: pnpm test
        type: string
    secrets:
      ORG_READ_TOKEN:
        description: Fine-grained token with read access to private submodules
        required: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository and private submodules
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Checkout private submodules
        env:
          SHARED_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
        run: |
          if [ -n "$SHARED_READ_TOKEN" ]; then
            git config --global url."https://x-access-token:${SHARED_READ_TOKEN}@github.com/".insteadOf "https://github.com/"
            git submodule update --init --recursive
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        if: ${{ inputs.check_command != '' }}
        run: ${{ inputs.check_command }}

      - name: Test
        if: ${{ inputs.test_command != '' }}
        run: ${{ inputs.test_command }}

  release:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository and private submodules
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Checkout private submodules
        env:
          SHARED_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
        run: |
          if [ -n "$SHARED_READ_TOKEN" ]; then
            git config --global url."https://x-access-token:${SHARED_READ_TOKEN}@github.com/".insteadOf "https://github.com/"
            git submodule update --init --recursive
          fi

      - name: Verify release version
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');

          const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const parse = (value) => {
            const match = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.exec(value ?? '');
            if (!match) throw new Error(`Invalid semantic version: ${value}`);
            return match.slice(1).map(Number);
          };
          const current = parse(version);

          let base = process.env.BEFORE_SHA;
          if (!base || /^0+$/.test(base)) base = 'HEAD^';
          let previousVersion;
          try {
            previousVersion = JSON.parse(execFileSync('git', ['show', `${base}:package.json`], { encoding: 'utf8' })).version;
          } catch {
            previousVersion = '0.0.0';
          }
          const previous = parse(previousVersion);
          const increased = current.some((part, index) =>
            part > previous[index] && current.slice(0, index).every((value, prior) => value === previous[prior])
          );
          if (!increased) {
            throw new Error(`package.json version must increase: ${previousVersion} -> ${version}`);
          }

          const output = process.env.GITHUB_OUTPUT;
          fs.appendFileSync(output, `version=${version}\nmajor=${current[0]}\nminor=${current[0]}.${current[1]}\n`);
          NODE

      - name: Determine build metadata
        id: meta
        run: |
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          build-args: |
            VITE_BUILD_TIME=${{ steps.meta.outputs.build_time }}
            VITE_BUILD_SHA=${{ steps.meta.outputs.short_sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:${{ steps.version.outputs.minor }}
            ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:${{ steps.version.outputs.major }}
            ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:${{ steps.meta.outputs.short_sha }}
            ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:latest
          cache-from: type=gha,scope=${{ inputs.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ inputs.cache_scope }},ignore-error=true

  dev-image:
    if: ${{ github.ref == 'refs/heads/dev' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository and private submodules
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Checkout private submodules
        env:
          SHARED_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
        run: |
          if [ -n "$SHARED_READ_TOKEN" ]; then
            git config --global url."https://x-access-token:${SHARED_READ_TOKEN}@github.com/".insteadOf "https://github.com/"
            git submodule update --init --recursive
          fi

      - name: Determine build metadata
        id: meta
        run: |
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push development image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          build-args: |
            VITE_BUILD_TIME=${{ steps.meta.outputs.build_time }}
            VITE_BUILD_SHA=${{ steps.meta.outputs.short_sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:dev
            ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}:dev-${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha,scope=${{ inputs.cache_scope }}-dev
          cache-to: type=gha,mode=max,scope=${{ inputs.cache_scope }}-dev,ignore-error=true
